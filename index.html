<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Marketing y Coaching</title>
    <!-- Enlace al CSS compilado por Tailwind -->
    <link href="./public/output.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FEF8F3] font-[Inter] text-[#1D1B19] antialiased">
    <header class="sticky top-0 z-50 w-full bg-[#FEF8F3] border-b border-[#1D1B19]">
        <div class="flex items-center justify-between py-4 px-6 md:px-12">

            <!-- LEFT: Brand Logo / Text -->
            <a href="#" class="font-[Bodoni_Moda] font-bold text-lg md:text-xl tracking-wide text-[#1D1B19] uppercase leading-tight" aria-label="Ir al inicio">
                ESTRATEGIA &amp; CLARIDAD
            </a>

            <!-- CENTER: Desktop Navigation (hidden on mobile) -->
            <nav class="hidden md:flex items-center gap-8" aria-label="Navegación principal">
                <a href="#services"
                   class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#1D1B19] hover:text-[#775A19] transition-colors duration-150 border-b border-transparent hover:border-[#1D1B19] pb-0.5">
                    Servicios
                </a>
                <a href="#about"
                   class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#1D1B19] hover:text-[#775A19] transition-colors duration-150 border-b border-transparent hover:border-[#1D1B19] pb-0.5">
                    Sobre mí
                </a>
                <a href="#testimonials"
                   class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#1D1B19] hover:text-[#775A19] transition-colors duration-150 border-b border-transparent hover:border-[#1D1B19] pb-0.5">
                    Testimonios
                </a>
            </nav>

            <!-- RIGHT: CTA Button + Mobile Toggle -->
            <div class="flex items-center gap-4">
                <!-- CTA: Primary Button (sharp corners per DESIGN.md) -->
                <a href="#book"
                   class="hidden sm:inline-block bg-[#1D1B19] text-[#FEF8F3] font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase px-5 py-3 border-2 border-[#1D1B19] hover:bg-[#C5A059] hover:text-[#1D1B19] hover:border-[#C5A059] transition-colors duration-200"
                   aria-label="Agendar una llamada">
                    Agendemos una cita
                </a>

                <!-- Hamburger Toggle (mobile only) -->
                <button id="menu-toggle"
                        class="md:hidden flex flex-col gap-1.5 p-1 focus:outline-none"
                        aria-label="Abrir menú de navegación"
                        aria-expanded="false"
                        aria-controls="mobile-menu">
                    <span class="block w-6 h-0.5 bg-[#1D1B19] transition-transform duration-200 origin-center" id="bar-1"></span>
                    <span class="block w-6 h-0.5 bg-[#1D1B19] transition-opacity duration-200" id="bar-2"></span>
                    <span class="block w-6 h-0.5 bg-[#1D1B19] transition-transform duration-200 origin-center" id="bar-3"></span>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Panel (hidden by default, toggled via JS) -->
        <div id="mobile-menu"
             class="hidden md:hidden border-t border-[#1D1B19] bg-[#FEF8F3]"
             role="region"
             aria-label="Menú móvil">
            <nav class="flex flex-col px-6 py-6 gap-4" aria-label="Navegación móvil">
                <a href="#services"
                   class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#1D1B19] hover:text-[#775A19] transition-colors duration-150">
                    Serivicios
                </a>
                <hr class="border-[#1D1B19]">
                <a href="#about"
                   class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#1D1B19] hover:text-[#775A19] transition-colors duration-150">
                    Sobre mí
                </a>
                <hr class="border-[#1D1B19]">
                <a href="#testimonials"
                   class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#1D1B19] hover:text-[#775A19] transition-colors duration-150">
                    Testimonios
                </a>
                <hr class="border-[#1D1B19]">
                <!-- Mobile CTA -->
                <a href="#book"
                   class="inline-block text-center bg-[#1D1B19] text-[#FEF8F3] font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase px-5 py-3 border-2 border-[#1D1B19] hover:bg-[#C5A059] hover:text-[#1D1B19] hover:border-[#C5A059] transition-colors duration-200 mt-2">
                    Agendemos una cita
                </a>
            </nav>
        </div>
    </header>

    <!-- Footer -->
    <footer class="bg-[#1D1B19] text-[#FEF8F3] w-full" role="contentinfo">
        <!-- Top structural separator (DESIGN.md: full-width 1px Charcoal line) -->
        <hr class="border-[#32302D] m-0">

        <div class="flex flex-col md:flex-row items-center justify-between gap-6 py-8 px-6 md:px-12">

            <!-- LEFT: Brand (matches header brand styling) -->
            <a href="#" class="font-[Bodoni_Moda] font-bold text-lg md:text-xl tracking-wide uppercase leading-tight text-[#FEF8F3] hover:text-[#C5A059] transition-colors duration-200" aria-label="Ir al inicio">
                ESTRATEGIA &amp; CLARIDAD
            </a>

            <!-- CENTER: Navigation & Social Links (label-caps from DESIGN.md) -->
            <nav class="flex flex-wrap items-center justify-center gap-x-6 gap-y-3" aria-label="Enlaces del pie de página">
                <a href="#" class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#FEF8F3] hover:text-[#C5A059] transition-colors duration-150 border-b border-transparent hover:border-[#C5A059] pb-0.5">
                    Política de Privacidad
                </a>
                <a href="#" target="_blank" rel="noopener noreferrer" class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#FEF8F3] hover:text-[#C5A059] transition-colors duration-150 border-b border-transparent hover:border-[#C5A059] pb-0.5">
                    Instagram
                </a>
                <a href="#" target="_blank" rel="noopener noreferrer" class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#FEF8F3] hover:text-[#C5A059] transition-colors duration-150 border-b border-transparent hover:border-[#C5A059] pb-0.5">
                    LinkedIn
                </a>
                <a href="#" target="_blank" rel="noopener noreferrer" class="font-[Inter] text-xs font-semibold tracking-[0.15em] leading-4 uppercase text-[#FEF8F3] hover:text-[#C5A059] transition-colors duration-150 border-b border-transparent hover:border-[#C5A059] pb-0.5">
                    Pinterest
                </a>
            </nav>

            <!-- RIGHT: Copyright (dimmed on-primary-container tone) -->
            <p class="font-[Inter] text-xs font-medium tracking-[0.15em] leading-4 uppercase text-[#878380] text-center md:text-right shrink-0">
                &copy; 2026 ESTRATEGIA &amp; CLARIDAD.<br class="md:hidden"> TODOS LOS DERECHOS RESERVADOS.
            </p>

        </div>
    </footer>

    <!-- Mobile Menu Toggle Script -->
    <script src="assets/js/main.js"></script>

</body>
</html>

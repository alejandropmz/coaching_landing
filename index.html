  <!DOCTYPE html>
  <html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriela — Liderazgo Consciente &amp; Desarrollo Personal</title>
    <meta name="description" content="Potencia tu liderazgo. Coaching de alto impacto para líderes visionarios y equipos que buscan transformación real.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;0,6..96,800;1,6..96,400;1,6..96,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./public/output.css">
  </head>
  <body class="bg-charcoal font-sans antialiased">
  <!-- ============================================================ -->
  <!--  HEADER / TOP NAVIGATION                                     -->
  <!-- ============================================================ -->
  <header class="absolute top-0 left-0 w-full z-30 py-5 px-6 md:px-12 flex items-center justify-between">
    <!-- Brand -->
    <a href="#" class="font-bodoni text-cream text-lg md:text-xl tracking-[0.12em] uppercase font-semibold hover:text-gold transition-colors duration-300">
      Gabriela, Lider y coach
    </a>

    <!-- Desktop Nav Links -->
    <nav class="hidden md:flex items-center space-x-8 lg:space-x-10">
      <a href="#servicios"   class="text-cream/75 hover:text-gold text-xs tracking-[0.15em] uppercase font-semibold transition-colors duration-300">Servicios</a>
      <a href="#sobre-mi"    class="text-cream/75 hover:text-gold text-xs tracking-[0.15em] uppercase font-semibold transition-colors duration-300">Sobre mi</a>
      <a href="#testimonios" class="text-cream/75 hover:text-gold text-xs tracking-[0.15em] uppercase font-semibold transition-colors duration-300">Testimonios</a>
    </nav>

    <!-- Desktop CTA Button -->
    <a href="#agendar" class="hidden md:inline-block border-2 border-gold text-gold hover:bg-gold hover:text-charcoal text-xs tracking-[0.15em] uppercase font-semibold px-6 py-2.5 transition-all duration-300">
      Agendar sesión
    </a>

    <!-- Mobile Hamburger Toggle -->
    <button id="mobile-toggle"
            class="md:hidden text-cream p-2 -mr-2 focus:outline-none"
            aria-label="Abrir menú de navegación"
            aria-expanded="false"
            onclick="document.getElementById('mobile-drawer').classList.toggle('translate-x-full'); var b=this; b.setAttribute('aria-expanded', b.getAttribute('aria-expanded')==='true'?'false':'true');">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="square" stroke-linejoin="miter" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </header>

  <!-- ============================================================ -->
  <!--  MOBILE NAVIGATION DRAWER                                    -->
  <!-- ============================================================ -->
  <div id="mobile-drawer"
       class="fixed inset-0 z-40 bg-charcoal translate-x-full transition-transform duration-500 ease-in-out flex flex-col items-center justify-center space-y-10 md:hidden">
    <!-- Close Button -->
    <button onclick="document.getElementById('mobile-drawer').classList.toggle('translate-x-full');"
            class="absolute top-6 right-6 text-cream p-2 focus:outline-none"
            aria-label="Cerrar menú">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="square" stroke-linejoin="miter" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <nav class="flex flex-col items-center space-y-8">
      <a href="#servicios"   class="text-cream/80 hover:text-gold text-lg tracking-[0.15em] uppercase font-semibold transition-colors duration-300" onclick="document.getElementById('mobile-drawer').classList.toggle('translate-x-full');">Servicios</a>
      <a href="#sobre-mi"    class="text-cream/80 hover:text-gold text-lg tracking-[0.15em] uppercase font-semibold transition-colors duration-300" onclick="document.getElementById('mobile-drawer').classList.toggle('translate-x-full');">Sobre mi</a>
      <a href="#testimonios" class="text-cream/80 hover:text-gold text-lg tracking-[0.15em] uppercase font-semibold transition-colors duration-300" onclick="document.getElementById('mobile-drawer').classList.toggle('translate-x-full');">Testimonios</a>
    </nav>

    <a href="#agendar" class="mt-8 border-2 border-gold text-gold hover:bg-gold hover:text-charcoal text-sm tracking-[0.15em] uppercase font-semibold px-8 py-3 transition-all duration-300" onclick="document.getElementById('mobile-drawer').classList.toggle('translate-x-full');">
      Agendar sesión
    </a>
  </div>
  <!-- ============================================================ -->
  <!--  HERO SECTION — FULL BACKGROUND IMAGE                        -->
  <!-- ============================================================ -->
  <section class="relative w-full min-h-screen flex items-center justify-center overflow-hidden">

    <!-- Background Image -->
    <img src="./assets/images/hero-image.png"
         alt="Gabriela — Liderazgo Consciente"
         class="absolute inset-0 w-full h-full object-cover">

    <!-- Atmospheric Dark Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-b from-charcoal/80 via-black/50 to-charcoal/80"></div>

    <!-- Subtle gold accent corner mark (editorial detail) -->
    <div class="absolute top-0 left-0 w-32 md:w-48 h-[2px] bg-gold/60 z-20"></div>
    <div class="absolute top-0 left-0 w-[2px] h-32 md:h-48 bg-gold/60 z-20"></div>

    <!-- Hero Content -->
    <div class="relative z-10 flex flex-col items-center justify-center text-center px-6 max-w-5xl mx-auto">

      <!-- Eyebrow — Label Caps -->
      <p class="text-gold text-[10px] sm:text-[11px] md:text-xs tracking-[0.2em] md:tracking-[0.25em] uppercase font-semibold mb-5 md:mb-7">
        LIDERAZGO CONSCIENTE + DESARROLLO PERSONAL
      </p>

      <!-- Decorative Gold Divider -->
      <div class="w-12 h-[2px] bg-gold mb-5 md:mb-7"></div>

      <!-- Main Headline — Bodoni Moda Editorial -->
      <h1 class="font-bodoni text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-white leading-[1.05] mb-6 md:mb-8 max-w-4xl">
        POTENCIA TU <br class="sm:hidden">LIDERAZGO
      </h1>

      <!-- Subtitle / Audience Focus -->
      <p class="text-cream/70 text-sm md:text-base lg:text-lg tracking-[0.12em] md:tracking-[0.15em] uppercase font-light max-w-2xl leading-relaxed">
        PARA LÍDERES VISIONARIOS + EQUIPOS DE ALTO IMPACTO
      </p>

      <!-- Hero CTA — Gold Button, Sharp Corners -->
      <a href="#agendar"
         class="mt-10 md:mt-14 inline-block bg-gold text-charcoal hover:bg-cream text-xs md:text-sm tracking-[0.15em] uppercase font-bold px-10 md:px-12 py-3.5 md:py-4 transition-all duration-300">
        Comienza tu transformación
      </a>

      <!-- Scroll Indicator -->
      <div class="absolute bottom-8 md:bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 text-cream/40">
        <span class="text-[10px] tracking-[0.2em] uppercase">Descubre más</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="square" stroke-linejoin="miter" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>

    </div>
  </section>

  </body>
  </html>
